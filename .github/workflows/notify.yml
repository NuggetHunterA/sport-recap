name: Notify

# 08:00 und 15:00 Berliner Zeit, je ein Lauf für Sommer- und Winterzeit (UTC)
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Welche Nachricht
        type: choice
        options: [morning, afternoon]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite-node scripts/notify.ts
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          MODE: ${{ inputs.mode || 'auto' }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
