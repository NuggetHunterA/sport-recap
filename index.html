<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efe7da" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sport Recap" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <title>Sport Recap</title>
  <style>
    /* Startbildschirm: Stadion bei Nacht, 1,2 s Animation + 0,3 s Ausblenden; Tippen überspringt */
    #splash { --u: min(1vw, 4.2px); position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 6); background: radial-gradient(120% 70% at 50% 0%, #16224a 0%, #0d1630 45%, #07090d 100%); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: opacity .3s ease-in; }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash.skip { opacity: 0; pointer-events: none; transition-duration: .2s; }
    #splash .logo { width: calc(var(--u) * 62); height: calc(var(--u) * 58); overflow: visible; }
    #splash .logo [class] { transform-box: fill-box; transform-origin: center; }
    #splash .moon { animation: splash-fade .4s ease-out both; }
    #splash .lamp { animation: splash-lamp .4s steps(1) .1s both; }
    #splash .cone { animation: splash-cone .45s ease-out .15s both; }
    #splash .arc { stroke-dasharray: 440; animation: splash-draw .5s cubic-bezier(.3,.7,.3,1) .3s both; }
    #splash .field { animation: splash-field .4s ease-out .55s both; }
    #splash .wm { font: 800 calc(var(--u) * 11)/1 'Bricolage Grotesque', system-ui, sans-serif; color: #eef1f6; letter-spacing: -.01em; animation: splash-wm .4s ease-out .7s both; }
    #splash .wm span { color: #f5821f; }
    #splash .tap { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 24px); text-align: center; font: 500 12px/1 'IBM Plex Sans', system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: rgba(238,241,246,.35); animation: splash-fade .3s ease-out .3s both; }
    @keyframes splash-lamp { 0% { fill: #3a4250 } 20% { fill: #ffd27a } 40% { fill: #3a4250 } 60%, 100% { fill: #ffd27a } }
    @keyframes splash-cone { 0%, 30% { opacity: 0 } 40% { opacity: .5 } 50% { opacity: .1 } 100% { opacity: 1 } }
    @keyframes splash-draw { from { stroke-dashoffset: 440 } to { stroke-dashoffset: 0 } }
    @keyframes splash-field { from { opacity: .15; transform: scaleX(.6) } to { opacity: 1; transform: none } }
    @keyframes splash-wm { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    @keyframes splash-fade { from { opacity: 0 } to { opacity: 1 } }
  </style>
</head>
<body>
  <div id="splash" role="img" aria-label="Sport Recap">
    <svg class="logo" viewBox="40 60 432 400" aria-hidden="true">
      <defs><radialGradient id="splash-cone" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#ffd27a" stop-opacity=".6"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>
      <g class="moon"><circle cx="380" cy="120" r="44" fill="#eef1f6"/><circle cx="402" cy="106" r="40" fill="#0f1a38"/></g>
      <path d="M60 360 Q256 250 452 360 L452 420 Q256 330 60 420 Z" fill="#1c2430"/>
      <path class="arc" d="M60 360 Q256 250 452 360" fill="none" stroke="#ff7a1a" stroke-width="12" stroke-linecap="round"/>
      <ellipse class="field" cx="256" cy="400" rx="150" ry="34" fill="#1f6b3a"/>
      <path class="field" d="M106 400 H406" stroke="#eef1f6" stroke-width="4" opacity=".6"/>
      <path class="cone" d="M96 180 L56 330 H194 L150 180Z" fill="url(#splash-cone)"/>
      <path d="M123 180 V330" stroke="#3a4250" stroke-width="10"/>
      <rect class="lamp" x="96" y="150" width="54" height="30" rx="6" fill="#3a4250"/>
    </svg>
    <div class="wm" aria-hidden="true">Sport <span>Recap</span></div>
    <div class="tap" aria-hidden="true">Tippen zum Überspringen</div>
  </div>
  <script>
    // Startbildschirm: läuft bei jedem frischen Laden 1,5 s (1,2 s + 0,3 s Ausblenden), Tippen überspringt
    (function () {
      var s = document.getElementById('splash');
      var done = false;
      function end(fast) {
        if (done) return;
        done = true;
        s.classList.add(fast ? 'skip' : 'out');
        setTimeout(function () { s.remove(); }, fast ? 220 : 320);
      }
      var t = setTimeout(function () { end(false); }, 1200);
      s.addEventListener('click', function () { clearTimeout(t); end(true); });
    })();
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
